<!doctype html>
<!--
  glass-flip-wipe · 玻璃 3D 翻转转场
  来源资产：components/react/glass-switch/glass-switch.tsx（3D 翻转 + 流光边框 + 毛玻璃）
  用法：把 outgoing/incoming 两个画面分别放进 .face-front / .face-back（可换成 <img>/<video>）。
  HyperFrames 契约：paused GSAP 时间轴注册到 window.__timelines["glass-flip-wipe"]
-->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      #stage {
        position: relative; width: 1920px; height: 1080px;
        display: grid; place-items: center; overflow: hidden;
        background: #05070d; perspective: 2400px;
      }
      .card {
        position: relative; width: 1920px; height: 1080px;
        transform-style: preserve-3d; will-change: transform;
      }
      .face {
        position: absolute; inset: 0;
        backface-visibility: hidden;
        display: grid; place-items: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 120px; font-weight: 800; color: #fff;
        overflow: hidden;
      }
      .face-front { background: linear-gradient(135deg, #1e1b4b, #0f172a); }
      .face-back { background: linear-gradient(135deg, #134e4a, #0f172a); transform: rotateY(180deg); }
      /* 流光边框 */
      .edge {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        border: 4px solid transparent;
        background:
          linear-gradient(#05070d, #05070d) padding-box,
          conic-gradient(from 0deg, #22d3ee, #8b5cf6, #ec4899, #a3e635, #22d3ee) border-box;
        -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        opacity: 0;
      }
      /* 对角高光掠过 */
      .sheen {
        position: absolute; top: -50%; left: -60%;
        width: 60%; height: 200%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
        transform: rotate(18deg); z-index: 4; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="glass-flip-wipe" data-start="0" data-duration="1.2" data-width="1920" data-height="1080">
      <div class="card" id="card">
        <div class="face face-front"><span>SCENE A</span></div>
        <div class="face face-back"><span>SCENE B</span></div>
        <div class="edge"></div>
        <div class="sheen"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ axis: "y", duration: 1.0, frontSrc: "", backSrc: "" });
      const rot = props.axis === "x" ? "rotationX" : "rotationY";
      // 素材槽：传入图片 URL 即填充画面，否则保留占位文字
      function fillSlot(sel, src) {
        if (!src) return;
        const el = document.querySelector(sel);
        el.style.backgroundImage = `url("${src}")`;
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
        const span = el.querySelector("span");
        if (span) span.style.display = "none";
      }
      fillSlot(".face-front", props.frontSrc);
      fillSlot(".face-back", props.backSrc);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 翻转主体：带轻微缩放景深 + 弹性收尾
      tl.fromTo("#card", { [rot]: 0, scale: 1 },
        { [rot]: 180, duration: props.duration, ease: "power3.inOut" }, 0);
      tl.to("#card", { scale: 0.86, duration: props.duration / 2, yoyo: true, repeat: 1, ease: "power2.inOut" }, 0);
      // 边框流光在翻转中点亮
      tl.fromTo(".edge", { opacity: 0 }, { opacity: 1, duration: props.duration * 0.5, yoyo: true, repeat: 1 }, 0);
      // 高光掠过
      tl.fromTo(".sheen", { x: 0 }, { x: 3400, duration: props.duration, ease: "power1.inOut" }, 0);
      window.__timelines["glass-flip-wipe"] = tl;
    </script>
    <script src="../../_engine/hf-preview.js"></script>
  </body>
</html>
