<!doctype html>
<!-- digital-wall-shatter · 瓷砖马赛克碎裂/聚合转场（源：Digital Wall 3D 瓷砖墙） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #05070d; perspective: 1600px; }
      .incoming { position: absolute; inset: 0; display: grid; place-items: center;
        background: linear-gradient(135deg, #134e4a, #0f172a); color: #fff;
        font-family: "Inter", system-ui, sans-serif; font-size: 120px; font-weight: 800; }
      .grid { position: absolute; inset: 0; display: grid; transform-style: preserve-3d; }
      .tile { background: linear-gradient(135deg, #1e1b4b, #312e81);
        border: 1px solid rgba(255,255,255,0.06); will-change: transform, opacity;
        box-shadow: inset 0 0 30px rgba(34,211,238,0.12); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="digital-wall-shatter" data-start="0" data-duration="1.6" data-width="1920" data-height="1080">
      <div class="incoming"><span>SCENE B</span></div>
      <div class="grid" id="grid"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ cols: 12, rows: 7, stagger: 0.5, seed: 11, inSrc: "" });
      if (props.inSrc) {
        const el = document.querySelector(".incoming");
        el.style.backgroundImage = `url("${props.inSrc}")`;
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
        const span = el.querySelector("span");
        if (span) span.style.display = "none";
      }
      const rnd = hfSeeded(props.seed);
      const grid = document.getElementById("grid");
      grid.style.gridTemplateColumns = `repeat(${props.cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${props.rows}, 1fr)`;
      const tiles = [];
      for (let i = 0; i < props.cols * props.rows; i++) {
        const t = document.createElement("div"); t.className = "tile"; grid.appendChild(t);
        tiles.push({ el: t, r: rnd() });
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 瓷砖逐个翻飞 + 淡出，露出 incoming 画面
      tl.to(tiles.map(t => t.el), {
        opacity: 0, z: () => -300 - rnd() * 400,
        rotationX: () => (rnd() - 0.5) * 120, rotationY: () => (rnd() - 0.5) * 120,
        duration: 0.7, ease: "power2.in",
        stagger: { each: props.stagger / (props.cols * props.rows), from: "random", grid: [props.rows, props.cols] },
      }, 0);
      window.__timelines["digital-wall-shatter"] = tl;
    </script>
    <script src="../../_engine/hf-preview.js"></script>
  </body>
</html>
