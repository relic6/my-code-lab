<!doctype html>
<!-- parallax-tilt-push · 视差倾斜推拉转场（源：_shared/useParallaxTilt） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05070d; perspective: 2000px; }
      .scene { position: absolute; inset: 0; display: grid; place-items: center; transform-style: preserve-3d;
        font-family: "Inter", system-ui, sans-serif; font-size: 130px; font-weight: 800; color: #fff; }
      .outgoing { background: linear-gradient(135deg, #1e293b, #0f172a); }
      .incoming { background: linear-gradient(135deg, #155e75, #0f172a); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="parallax-tilt-push" data-start="0" data-duration="1.4" data-width="1920" data-height="1080">
      <div class="scene outgoing" id="out"><span>SCENE A</span></div>
      <div class="scene incoming" id="in"><span>SCENE B</span></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ tiltMax: 22, depth: 600, outSrc: "", inSrc: "" });
      function fillSlot(sel, src) {
        if (!src) return;
        const el = document.querySelector(sel);
        el.style.backgroundImage = `url("${src}")`;
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
        const span = el.querySelector("span");
        if (span) span.style.display = "none";
      }
      fillSlot(".outgoing", props.outSrc);
      fillSlot(".incoming", props.inSrc);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.inOut" } });
      // 旧场景倾斜后退离场
      tl.to("#out", { rotationY: -props.tiltMax, z: -props.depth, x: -400, opacity: 0, duration: 0.8 }, 0);
      // 新场景从倾斜深处推近
      gsap.set("#in", { rotationY: props.tiltMax, z: -props.depth, x: 400 });
      tl.to("#in", { rotationY: 0, z: 0, x: 0, opacity: 1, duration: 0.8 }, 0.2);
      window.__timelines["parallax-tilt-push"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
