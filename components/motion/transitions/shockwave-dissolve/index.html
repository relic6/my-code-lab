<!doctype html>
<!-- shockwave-dissolve · 冲击波扩散 + 溶解转场（源：Launching 冲击波） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05070d; }
      .scene { position: absolute; inset: 0; display: grid; place-items: center;
        font-family: "Inter", system-ui, sans-serif; font-size: 130px; font-weight: 800; color: #fff; }
      .outgoing { background: linear-gradient(135deg, #3b0764, #0f172a); }
      .incoming { background: linear-gradient(135deg, #083344, #0f172a); opacity: 0; }
      .wave { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
        border-radius: 50%; border: 6px solid var(--wc, #f59e0b); opacity: 0; mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="shockwave-dissolve" data-start="0" data-duration="1.6" data-width="1920" data-height="1080">
      <div class="scene outgoing"><span>SCENE A</span></div>
      <div class="scene incoming" id="incoming"><span>SCENE B</span></div>
      <div class="wave" id="w1"></div>
      <div class="wave" id="w2"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ waveColor: "#f59e0b", softness: 1, outSrc: "", inSrc: "" });
      function fillSlot(sel, src) {
        if (!src) return;
        const el = document.querySelector(sel);
        el.style.backgroundImage = `url("${src}")`;
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
        const span = el.querySelector("span");
        if (span) span.style.display = "none";
      }
      fillSlot(".outgoing", props.outSrc);
      fillSlot(".incoming", props.inSrc);
      document.querySelectorAll(".wave").forEach(w => w.style.setProperty("--wc", props.waveColor));
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 双层冲击波扩散
      tl.fromTo("#w1", { scale: 0.4, opacity: 0.9 }, { scale: 60, opacity: 0, duration: 1.1, ease: "power2.out" }, 0);
      tl.fromTo("#w2", { scale: 0.4, opacity: 0.7 }, { scale: 60, opacity: 0, duration: 1.1, ease: "power2.out" }, 0.15);
      // 溶解切换（伴随轻微模糊增强冲击感）
      tl.to(".outgoing", { opacity: 0, filter: `blur(${12 * props.softness}px)`, duration: 0.6, ease: "power2.inOut" }, 0.4);
      tl.to("#incoming", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 0.4);
      window.__timelines["shockwave-dissolve"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
