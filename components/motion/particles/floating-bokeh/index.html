<!doctype html>
<!-- floating-bokeh · 漂浮虚焦光斑层（源：Glass 气泡） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(135deg, #1a1040, #05070d); }
      .bokeh { position: absolute; border-radius: 50%; filter: blur(14px); mix-blend-mode: screen;
        will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="floating-bokeh" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="field"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ count: 28, speed: 1, seed: 13,
        colors: ["#22d3ee", "#8b5cf6", "#ec4899", "#a3e635"] });
      const rnd = hfSeeded(props.seed);
      const field = document.getElementById("field");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "sine.inOut" } });
      for (let i = 0; i < props.count; i++) {
        const b = document.createElement("i"); b.className = "bokeh";
        const size = 40 + rnd() * 180;
        b.style.width = size + "px"; b.style.height = size + "px";
        b.style.background = props.colors[Math.floor(rnd() * props.colors.length)];
        b.style.opacity = (0.15 + rnd() * 0.35).toFixed(2);
        const x = rnd() * 1920, y = rnd() * 1080;
        gsap.set(b, { x, y });
        field.appendChild(b);
        // 缓慢漂移（yoyo 有限）
        tl.to(b, { x: x + (rnd() - 0.5) * 300, y: y + (rnd() - 0.5) * 300,
          duration: (6 + rnd() * 4) / props.speed, yoyo: true, repeat: 1 }, 0);
      }
      window.__timelines["floating-bokeh"] = tl;
    </script>
    <script src="../../_engine/hf-preview.js"></script>
  </body>
</html>
