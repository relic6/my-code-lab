<!doctype html>
<!-- glow-embers · 上升发光余烬粒子（源：Launching 尾焰，确定性 PRNG） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 50% 90%, #2a1005, #05070d 60%); }
      .ember { position: absolute; bottom: -40px; width: 14px; height: 14px; border-radius: 50%;
        background: radial-gradient(circle, #fff, var(--c, #f59e0b) 45%, transparent 72%); will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="glow-embers" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="field"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ count: 60, color: "#f59e0b", speed: 1, seed: 9 });
      const rnd = hfSeeded(props.seed);
      const field = document.getElementById("field");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, repeat: 0 });
      const total = 5;
      for (let i = 0; i < props.count; i++) {
        const e = document.createElement("i"); e.className = "ember";
        e.style.setProperty("--c", props.color);
        const x = rnd() * 1920, scale = 0.4 + rnd() * 1.1, dur = (3 + rnd() * 2) / props.speed;
        const start = rnd() * total, drift = (rnd() - 0.5) * 240;
        gsap.set(e, { x, scale });
        field.appendChild(e);
        tl.fromTo(e, { y: 0, opacity: 0, filter: "blur(0px)" },
          { y: -1180, x: x + drift, opacity: 1, duration: 0.3, ease: "power1.out" }, start);
        tl.to(e, { opacity: 0, scale: scale * 0.2, filter: "blur(4px)", duration: dur, ease: "power1.in" }, start + 0.3);
      }
      window.__timelines["glow-embers"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
