<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="promo" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div
        id="clip-0"
        class="clip"
        data-composition-id="aurora-gradient-0"
        data-composition-src="compositions/aurora-gradient-0.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="clip-1"
        class="clip"
        data-composition-id="kinetic-typography-1"
        data-composition-src="compositions/kinetic-typography-1.html"
        data-start="0.5"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="clip-2"
        class="clip"
        data-composition-id="glass-caption-bar-2"
        data-composition-src="compositions/glass-caption-bar-2.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="clip-3"
        class="clip"
        data-composition-id="hud-overlay-3"
        data-composition-src="compositions/hud-overlay-3.html"
        data-start="8"
        data-duration="4"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

    </div>
    <script>
      // 宿主自身无动画：注册一个空的 paused 时间轴满足 GSAP 适配器契约
      window.__timelines = window.__timelines || {};
      window.__timelines["promo"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
