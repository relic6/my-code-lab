<!doctype html>
<html lang="zh">
  <head><meta charset="utf-8" /></head>
  <body>
    <template>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px;
        background: linear-gradient(135deg, #1a2440, #0a0e1a); font-family: "Inter", system-ui, sans-serif; }
      .bar { position: absolute; left: 120px; bottom: 120px; min-width: 720px; max-width: 1400px;
        padding: 36px 56px; border-radius: 22px; overflow: hidden;
        background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16);
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
      .label { font-size: 30px; letter-spacing: 0.3em; color: var(--accent, #22d3ee); margin-bottom: 12px; opacity: 0.85; }
      .text { font-size: 56px; font-weight: 700; color: #fff; line-height: 1.2; }
      .sheen { position: absolute; top: 0; left: -40%; width: 35%; height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: skewX(-18deg); pointer-events: none; }
    </style>
      <div id="stage" data-composition-id="glass-caption-bar-2" data-start="0" data-width="1920" data-height="1080">
      <div class="bar" id="bar">
        <div class="label" id="label">NOW PLAYING</div>
        <div class="text" id="text">毛玻璃字幕条 · Glass Caption</div>
        <div class="sheen" id="sheen"></div>
      </div>
    </div>
      <script>window.__props = {"label":"MOTION SYSTEM","text":"代码化 · 确定性 · 可批量","accent":"#a3e635"};</script>
      <script>// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};</script>
      <script>
      const props = hfProps({ label: "NOW PLAYING", text: "毛玻璃字幕条 · Glass Caption", accent: "#22d3ee" });
      document.getElementById("label").textContent = props.label;
      document.getElementById("text").textContent = props.text;
      document.getElementById("bar").style.setProperty("--accent", props.accent);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#bar", { y: 80, opacity: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.from("#label", { opacity: 0, x: -20, duration: 0.5 }, 0.2);
      tl.from("#text", { opacity: 0, x: -20, duration: 0.5 }, 0.35);
      // 高光掠过
      tl.fromTo("#sheen", { x: 0 }, { x: 2600, duration: 1.4, ease: "power1.inOut" }, 0.6);
      window.__timelines["glass-caption-bar-2"] = tl;
    </script>
    </template>
  </body>
</html>
