<!doctype html>
<!-- grid-perspective · 赛博透视网格地面（源：Digital Wall 3D 透视） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(180deg, #0a0118 0%, #1a0b2e 55%, #2a0e3a 100%); perspective: 600px; }
      .sun { position: absolute; top: 24%; left: 50%; width: 520px; height: 520px; transform: translate(-50%,-50%);
        border-radius: 50%; background: radial-gradient(circle, #ff2d95, #7b2ff7 60%, transparent 72%); filter: blur(8px); opacity: 0.85; }
      .floor { position: absolute; bottom: 0; left: -50%; width: 200%; height: 60%;
        transform-origin: 50% 100%; transform: rotateX(78deg);
        background-image:
          linear-gradient(rgba(34,211,238,0.6) 2px, transparent 2px),
          linear-gradient(90deg, rgba(34,211,238,0.6) 2px, transparent 2px);
        background-size: 80px 80px; will-change: background-position; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="grid-perspective" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="sun"></div>
      <div class="floor" id="floor"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ scrollSpeed: 1 });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 网格向观察者滚动（背景位移，循环对齐 80px 网格）
      tl.fromTo("#floor", { backgroundPosition: "0px 0px" },
        { backgroundPosition: `0px ${800 * props.scrollSpeed}px`, duration: 8, ease: "none" }, 0);
      tl.from(".sun", { opacity: 0, y: 60, duration: 1.2, ease: "power2.out" }, 0);
      window.__timelines["grid-perspective"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
