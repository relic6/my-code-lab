<!doctype html>
<!-- radar-sweep · 可复用雷达扫描贴纸（源：The Ark 雷达扫描） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; display: grid; place-items: center;
        background: #05070d; font-family: "JetBrains Mono", monospace; }
      .radar { position: relative; width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, rgba(34,211,238,0.06), transparent 70%);
        border: 2px solid rgba(34,211,238,0.35); overflow: hidden; }
      .gridline { position: absolute; background: rgba(34,211,238,0.18); }
      .h { left: 0; right: 0; height: 1px; top: 50%; }
      .v { top: 0; bottom: 0; width: 1px; left: 50%; }
      .sweep { position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, var(--c, #22d3ee) 0deg, transparent 60deg); opacity: 0.45; }
      .blip { position: absolute; width: 14px; height: 14px; border-radius: 50%;
        background: var(--c, #22d3ee); box-shadow: 0 0 14px var(--c, #22d3ee); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="radar-sweep" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="radar" id="radar">
        <div class="gridline h"></div><div class="gridline v"></div>
        <div class="sweep" id="sweep"></div>
        <div class="blip" id="b1" style="top:30%;left:62%"></div>
        <div class="blip" id="b2" style="top:64%;left:40%"></div>
        <div class="blip" id="b3" style="top:48%;left:72%"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ color: "#22d3ee", revolutions: 3 });
      document.getElementById("radar").style.setProperty("--c", props.color);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#radar", { scale: 0.7, opacity: 0, duration: 0.5, ease: "back.out(1.5)" }, 0);
      tl.to("#sweep", { rotation: 360 * props.revolutions, duration: 4, ease: "none" }, 0);
      // 扫到时点亮光点
      [["#b1",0.6],["#b2",1.1],["#b3",1.6]].forEach(([b,t]) => {
        tl.fromTo(b, { opacity: 1, scale: 1.4 }, { opacity: 0, scale: 0.8, duration: 1.0, ease: "power2.out" }, t);
      });
      window.__timelines["radar-sweep"] = tl;
    </script>
    <script src="../../_engine/hf-preview.js"></script>
  </body>
</html>
