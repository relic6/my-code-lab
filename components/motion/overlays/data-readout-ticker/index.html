<!doctype html>
<!-- data-readout-ticker · 滚动数据/数值跳动叠层（源：The Ark 读数） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; background: #05070d;
        font-family: "JetBrains Mono", monospace; color: #e6f1ff; }
      .panel { position: absolute; left: 120px; top: 50%; transform: translateY(-50%);
        display: grid; gap: 28px; }
      .row { display: grid; grid-template-columns: 260px 220px; align-items: baseline; opacity: 0; }
      .k { font-size: 28px; letter-spacing: 0.2em; color: var(--accent, #22d3ee); }
      .v { font-size: 64px; font-weight: 700; text-align: right; }
      .unit { font-size: 26px; color: #7d93a8; margin-left: 10px; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="data-readout-ticker" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="panel" id="panel"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ accent: "#22d3ee", rows: [
        { k: "THROUGHPUT", to: 9482, unit: "ops/s" },
        { k: "LATENCY", to: 42, unit: "ms" },
        { k: "UPTIME", to: 99, unit: "%" }
      ] });
      const panel = document.getElementById("panel");
      panel.style.setProperty("--accent", props.accent);
      const rows = props.rows.map(r => {
        const el = document.createElement("div"); el.className = "row";
        el.innerHTML = `<div class="k">${r.k}</div><div><span class="v">0</span><span class="unit">${r.unit}</span></div>`;
        panel.appendChild(el);
        return { el, valEl: el.querySelector(".v"), to: r.to, obj: { v: 0 } };
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      rows.forEach((r, i) => {
        tl.to(r.el, { opacity: 1, duration: 0.4 }, i * 0.2);
        tl.from(r.el, { x: -30, duration: 0.4, ease: "power2.out" }, i * 0.2);
        tl.to(r.obj, { v: r.to, duration: 1.6, ease: "power1.out",
          onUpdate: () => r.valEl.textContent = Math.floor(r.obj.v).toLocaleString() }, i * 0.2 + 0.2);
      });
      window.__timelines["data-readout-ticker"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
