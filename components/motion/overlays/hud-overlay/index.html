<!doctype html>
<!-- hud-overlay · 科技感 HUD 叠层（源：The Ark 雷达/环形 HUD/数据读数） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #071018, #05070d 70%);
        font-family: "JetBrains Mono", monospace; color: var(--accent, #22d3ee); }
      .ring { position: absolute; top: 50%; left: 50%; border-radius: 50%;
        border: 2px solid rgba(34,211,238,0.4); transform: translate(-50%,-50%); }
      .r1 { width: 760px; height: 760px; }
      .r2 { width: 560px; height: 560px; border-style: dashed; opacity: 0.6; }
      .r3 { width: 360px; height: 360px; border-color: rgba(34,211,238,0.7); }
      .sweep { position: absolute; top: 50%; left: 50%; width: 380px; height: 380px;
        transform: translate(-50%,-50%); border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(34,211,238,0.35) 40deg, transparent 80deg); }
      .tick { position: absolute; top: 50%; left: 50%; width: 4px; height: 16px; background: rgba(34,211,238,0.5);
        transform-origin: 2px 380px; }
      .readout { position: absolute; font-size: 26px; letter-spacing: 0.15em; opacity: 0; }
      .ro1 { top: 120px; left: 120px; }
      .ro2 { bottom: 120px; right: 140px; text-align: right; }
      .corner { position: absolute; width: 80px; height: 80px; border: 3px solid rgba(34,211,238,0.7); }
      .c-tl { top: 60px; left: 60px; border-right: none; border-bottom: none; }
      .c-br { bottom: 60px; right: 60px; border-left: none; border-top: none; }
      .big { font-size: 40px; font-weight: 700; color: #fff; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="hud-overlay" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="corner c-tl"></div><div class="corner c-br"></div>
      <div class="ring r1" id="r1"></div>
      <div class="ring r2" id="r2"></div>
      <div class="ring r3" id="r3"></div>
      <div class="sweep" id="sweep"></div>
      <div class="readout ro1" id="ro1">SYS · <span class="big" id="sys">000</span><br/>SIGNAL LOCKED</div>
      <div class="readout ro2" id="ro2">ALT <span class="big" id="alt">0000</span> m<br/>VEL 0.00 km/s</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ accent: "#22d3ee", scanSpeed: 1 });
      document.getElementById("stage").style.setProperty("--accent", props.accent);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 入场
      tl.from(["#r1","#r2","#r3"], { scale: 0.6, opacity: 0, duration: 0.7, stagger: 0.12, ease: "back.out(1.4)" }, 0);
      tl.to(["#ro1","#ro2"], { opacity: 1, duration: 0.5, stagger: 0.15 }, 0.5);
      // 环旋转（有限 repeat）
      const reps = Math.ceil(5 * props.scanSpeed);
      tl.to("#r2", { rotation: 360, duration: 5 / props.scanSpeed, repeat: 0, ease: "none" }, 0);
      tl.to("#sweep", { rotation: 360 * Math.max(1, reps), duration: 5, ease: "none" }, 0);
      tl.to("#r3", { rotation: -360, duration: 5, ease: "none" }, 0);
      // 数据读数跳动（确定性递增）
      const sys = { sysv: 0 }, alt = { altv: 0 };
      tl.to(sys, { sysv: 847, duration: 2, ease: "power1.out", overwrite: false, onUpdate: () => document.getElementById("sys").textContent = String(Math.floor(sys.sysv)).padStart(3,"0") }, 0.6);
      tl.to(alt, { altv: 12840, duration: 3, ease: "power1.out", overwrite: false, onUpdate: () => document.getElementById("alt").textContent = String(Math.floor(alt.altv)).padStart(4,"0") }, 0.6);
      window.__timelines["hud-overlay"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
