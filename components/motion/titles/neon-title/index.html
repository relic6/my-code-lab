<!doctype html>
<!-- neon-title · 霓虹发光大标题（源：_shared 霓虹色板 + --glow-*） -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 50%, #11131f, #05070d 70%);
        font-family: "Inter", system-ui, sans-serif; }
      .neon { font-size: 220px; font-weight: 900; letter-spacing: 0.04em; color: #fff; }
      .sub { position: absolute; bottom: 30%; font-size: 44px; letter-spacing: 0.5em; color: #9fb3c8; opacity: 0; }
      .neon.lit { color: var(--c, #22d3ee);
        text-shadow:
          0 0 8px var(--c), 0 0 18px var(--c), 0 0 36px var(--c),
          0 0 72px rgba(34,211,238,0.6); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="neon-title" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <h1 class="neon" id="neon">NEON</h1>
      <div class="sub" id="sub">CODE · AS · MOTION</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ text: "NEON", sub: "CODE · AS · MOTION", color: "#22d3ee", flicker: true });
      const el = document.getElementById("neon"); el.textContent = props.text;
      const sub = document.getElementById("sub"); sub.textContent = props.sub;
      el.style.setProperty("--c", props.color);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 通电闪烁点亮（确定性关键帧模拟霓虹灯启辉）
      tl.set(el, { className: "neon" }, 0);
      if (props.flicker) {
        [0.0, 0.12, 0.2, 0.32, 0.42].forEach((t, i) => {
          tl.set(el, { className: i % 2 === 0 ? "neon lit" : "neon" }, t);
        });
      }
      tl.set(el, { className: "neon lit" }, 0.5);
      tl.from(el, { scale: 0.9, duration: 0.6, ease: "back.out(1.6)" }, 0.5);
      // 字间呼吸辉光
      tl.to(el, { filter: "brightness(1.3)", duration: 1, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.2);
      // 副标题渐入
      tl.to(sub, { opacity: 1, letterSpacing: "0.6em", duration: 0.8, ease: "power2.out" }, 0.9);
      window.__timelines["neon-title"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
