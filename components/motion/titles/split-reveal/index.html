<!doctype html>
<!-- split-reveal · 文字遮罩拆分揭示 -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; display: grid; place-items: center;
        background: linear-gradient(135deg, #0b1020, #05070d); font-family: "Inter", system-ui, sans-serif; }
      .wrap { position: relative; overflow: hidden; padding: 0 8px; }
      .word { font-size: 200px; font-weight: 800; color: #fff; line-height: 1.05;
        text-shadow: 0 0 28px rgba(34,211,238,0.35); }
      .mask { position: absolute; inset: 0; background: var(--accent, #22d3ee); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="split-reveal" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="word" id="word">REVEAL</div>
        <div class="mask" id="mask"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- hf-core:start -->
    <script>
// hf-core.js · 动效模板共享核心（单一来源）
// 由 _engine/build.mjs 内联进每个合成的 <!-- hf-core --> 标记块，
// 保证输出仍是自包含 HTML（HyperFrames 渲染安全），同时只需在此处维护一次。
//
// 提供：
//   hfSeeded(seed)      —— 确定性 PRNG（mulberry32），替代 Math.random 保逐帧一致
//   hfProps(defaults)   —— 合并模板默认参数与 window.__props（AI/工程文件覆盖入口）
window.hfSeeded = window.hfSeeded || function (seed) {
  var a = (seed || 1) >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
window.hfProps = function (defaults) {
  return Object.assign({}, defaults || {}, window.__props || {});
};
    </script>
    <!-- hf-core:end -->
    <script>
      const props = hfProps({ text: "REVEAL", axis: "x", accent: "#22d3ee" });
      document.getElementById("word").textContent = props.text;
      document.getElementById("mask").style.background = props.accent;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#word", { opacity: 0 });
      const origin = props.axis === "y" ? "center top" : "left center";
      gsap.set("#mask", { transformOrigin: origin });
      // 色块扫过：先铺满遮住文字，扫到一半时显字，再退出露出文字
      const sc = props.axis === "y" ? "scaleY" : "scaleX";
      tl.fromTo("#mask", { [sc]: 0 }, { [sc]: 1, duration: 0.5, ease: "power3.in" }, 0);
      tl.set("#word", { opacity: 1 }, 0.5);
      tl.set("#mask", { transformOrigin: props.axis === "y" ? "center bottom" : "right center" }, 0.5);
      tl.to("#mask", { [sc]: 0, duration: 0.6, ease: "power3.out" }, 0.55);
      tl.from("#word", { y: 30, duration: 0.6, ease: "back.out(1.5)" }, 0.55);
      window.__timelines["split-reveal"] = tl;
    </script>
    <script src="/components/motion/_engine/hf-preview.js"></script>
  </body>
</html>
